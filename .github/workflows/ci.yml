name: SHARESPACE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "postgresql+asyncpg://sharespace_app:changeme@localhost:5432/sharespace_test"
  SYNC_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/sharespace_test"
  DATABASE_MIGRATION_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/sharespace_test"
  SECRET_KEY: "test-secret-key-for-ci-testing-only-32-chars-min"
  ENVIRONMENT: "test"
  DEBUG: "true"
  LOG_LEVEL: "DEBUG"
  ENABLE_DEMO_LOGIN: "true"
  DEMO_DEFAULT_ORG_ID: "org_nit"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run mypy type checking
        run: mypy

  backend-tests:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharespace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Initialize PostgreSQL extensions and roles
        run: python scripts/init_test_db.py

      - name: Run migrations
        run: |
          alembic -c migrations/alembic.ini upgrade head
          python scripts/grant_test_db_permissions.py

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run lint

      - name: Build
        run: bun run build

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run truffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sharespace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Initialize PostgreSQL extensions and roles
        run: python scripts/init_test_db.py

      - name: Test migration from empty
        run: |
          alembic -c migrations/alembic.ini upgrade head

      - name: Test migration downgrade/upgrade cycle
        run: |
          alembic -c migrations/alembic.ini downgrade -1
          alembic -c migrations/alembic.ini upgrade head

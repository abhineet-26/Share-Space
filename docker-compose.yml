services:
  db:
    image: postgres:17-alpine
    container_name: sharespace-db
    environment:
      POSTGRES_DB: sharespace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - sharespace_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sharespace"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sharespace-backend
    environment:
      APP_NAME: "SHARESPACE"
      APP_VERSION: "0.1.0"
      ENVIRONMENT: "development"
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://sharespace_app:changeme@db:5432/sharespace"
      DATABASE_MIGRATION_URL: "postgresql+asyncpg://sharespace_migrate:changeme@db:5432/sharespace"
      SYNC_DATABASE_URL: "postgresql://sharespace_migrate:changeme@db:5432/sharespace"
      SECRET_KEY: "sharespace-mvp-super-secret-key-32-chars-min-length-required"
      ENABLE_DEMO_LOGIN: "true"
      DEMO_DEFAULT_ORG_ID: "org_nit"
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sharespace-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  sharespace_pgdata:

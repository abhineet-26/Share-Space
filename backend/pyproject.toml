[project]
name = "sharespace-backend"
version = "0.1.0"
description = "SHARESPACE FastAPI Backend - Trusted Institutional Resource Sharing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "SHARESPACE Team", email = "abhi040307@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.36",
    "alembic==1.14.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.10",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "authlib==1.3.1",
    "httpx==0.27.2",
    "pydantic-extra-types==2.10.0",
    "email-validator==2.2.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",
    "ulid-py==1.1.0",
    "tenacity==8.5.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "faker==33.1.0",
    "typing-extensions==4.12.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.0",
    "mypy==1.13.0",
    "pre-commit==3.8.0",
    "black==24.10.0",
    "isort==5.13.2",
]
ai = [
    "google-genai==0.3.0",
]
monitoring = [
    "sentry-sdk==2.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".cpython3.11", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008", "TRY003", "B904", "ARG001", "TRY400"]
extend-select = ["ARG", "PTH", "ERA", "PD", "PL"]
per-file-ignores = { "migrations/**/*.py" = ["E501", "I001", "PLR0915", "PLR0912", "PLR2004", "W291"], "tests/**/*.py" = ["S101", "S106", "PLR2004", "T201"], "scripts/**/*.py" = ["T201", "PLR0915"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database",
    "api: API contract tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"